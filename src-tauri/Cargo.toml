[package]
name = "mdvim"
version = "0.1.0"
description = "Cross-platform Markdown & Text Editor with True Embedded Neovim and WYSIWYG Projection"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmpv = { version = "1.3", features = ["with-serde"] }
